<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة تحكم البوت</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<form id="login" class="card">
  <h1>🤖 لوحة الإدارة</h1>
  <p class="dim">الدخول للإدارة فقط</p>
  <input id="uid" inputmode="numeric" placeholder="آيدي الديسكورد" autocomplete="username" required>
  <input id="pw" type="password" placeholder="الباسورد" autocomplete="current-password" required>
  <button class="blue">دخول</button>
</form>

<div id="app" class="hidden">
  <aside>
    <h2>🤖 لوحة الإدارة</h2>
    <select id="guild"></select>
    <div id="rank" class="dim"></div>
    <nav id="nav"></nav>
    <button id="logout">خروج</button>
  </aside>
  <main><h2 id="title"></h2><div id="panel"></div></main>
</div>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div id="toast" class="hidden"></div>
<script src="app.js"></script>
</body>
</html>
